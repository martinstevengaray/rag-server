<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Received</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
        }
        pre {
            background: #f4f4f4;
            padding: 12px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        a {
            display: inline-block;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <h1>Text received &#10003;</h1>
    <p>The server received <strong>{{length}}</strong> characters:</p>
    <pre>{{content}}</pre>
    <a href="/">Send more</a>
</body>
</html>
