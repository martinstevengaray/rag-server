<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAG Server</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
        }
        textarea {
            width: 100%;
            min-height: 160px;
            box-sizing: border-box;
            font-size: 14px;
            padding: 8px;
        }
        button {
            margin-top: 12px;
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
        }
        #status {
            margin-top: 12px;
            white-space: pre-wrap;
            color: #444;
        }
        #result {
            margin-top: 20px;
        }
        #result pre {
            background: #f4f4f4;
            padding: 12px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>RAG Server</h1>
    <textarea id="input" placeholder="Enter text here..."></textarea>
    <button id="send">Send</button>
    <div id="status"></div>

    <div id="result" hidden>
        <p>The server received <strong id="length"></strong> characters:</p>
        <pre id="content"></pre>
    </div>

    <script>
        const button = document.getElementById("send");
        const input = document.getElementById("input");
        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const lengthEl = document.getElementById("length");
        const contentEl = document.getElementById("content");

        let inFlight = false;   // guard against overlapping requests

        button.addEventListener("click", async () => {
            if (inFlight) return;
            inFlight = true;
            button.disabled = true;
            button.textContent = "Sending…";
            status.textContent = "";

            try {
                const response = await fetch("/text", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: input.value })
                });
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                const data = await response.json();   // { length, content }
                lengthEl.textContent = data.length;
                contentEl.textContent = data.content; // textContent avoids any HTML injection
                result.hidden = false;
            } catch (err) {
                status.textContent = "Error: " + err;
            } finally {
                inFlight = false;
                button.disabled = false;
                button.textContent = "Send";
            }
        });
    </script>
</body>
</html>
