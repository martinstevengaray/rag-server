<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'
                    viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
    <title>Exegesis</title>
    <style>
        html {
            height: 100%;
        }
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            height: 100vh;    /* fallback for browsers without dvh */
            height: 100dvh;   /* the visible viewport, excluding mobile browser chrome */
        }
        /* A comfortable centered column that fills the viewport exactly: the composer is
           always on screen and the chat absorbs whatever height is left. */
        #chat {
            max-width: 640px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }
        /* flex:none so the header keeps its height and only the chat absorbs the slack */
        header {
            flex: none;
            margin: 0 0 12px;
            text-align: center;
        }
        .title {
            margin: 2px 0 0;
            font-size: 18px;
            color: #444;
        }
        .meta {
            margin: 6px 0 0;
            font-size: 12px;
            color: #666;
        }
        /* tighter gap between the two small lines so they read as one group under the tagline */
        .meta + .meta {
            margin-top: 2px;
        }
        .meta a {
            color: #0b5cad;
        }
        /* the widget is a flex column itself; this lets it absorb the leftover height */
        #rag-chat {
            flex: 1;
            min-height: 0;
        }
        @media (min-width: 700px) {
            body {
                padding: 40px 16px;
            }
        }
    </style>
</head>
<body>
    <div id="chat">
        <header>
            <p class="title">Retrieval-Augmented Generation Chat</p>
            <p class="meta">Currently serving: <span id="corpus">Oregon Revised Statutes</span></p>
            <p class="meta">
                Java 21 · AWS Lambda · S3 Vectors
                <a href="https://github.com/martinstevengaray/rag-server"
                   target="_blank" rel="noopener noreferrer">Source on GitHub</a>
            </p>
        </header>

        <!-- This page is just chrome around the widget. The chat itself lives in widget.js so
             that this page and any embedding site run the exact same client. -->
        <div id="rag-chat" data-rag-chat
             data-rag-placeholder="Ask about the Oregon Revised Statutes…"></div>
    </div>

    <script src="/widget.js"></script>
</body>
</html>
