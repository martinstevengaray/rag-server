<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portland City Code</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 0 auto;
            padding: 40px 16px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1 {
            margin: 0 0 12px;
        }
        #conversation {
            flex: 1;
            min-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }
        .msg.user {
            align-self: flex-end;
            background: #d6eaff;
            border-bottom-right-radius: 2px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: #eee;
            border-bottom-left-radius: 2px;
        }
        #composer {
            display: flex;
            flex-direction: column;
            margin-top: 12px;
        }
        textarea {
            width: 100%;
            min-height: 72px;
            box-sizing: border-box;
            font-size: 14px;
            padding: 8px;
        }
        button {
            align-self: flex-end;
            margin-top: 8px;
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
        }
        #status {
            margin-top: 8px;
            white-space: pre-wrap;
            color: #444;
        }
        #session,
        #debug {
            margin-top: 4px;
            color: #444;
            font-size: 13px;
        }
        #session code,
        #debug code {
            display: block;
            white-space: pre-wrap;
            word-wrap: break-word;
            height: 40px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 4px 6px;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <h1>RAG Server</h1>

    <div id="conversation"></div>

    <div id="composer">
        <textarea id="input" placeholder="Enter text here..."></textarea>
        <button id="send">Send</button>
    </div>

    <div id="status"></div>
    <div id="session">Session state: <code id="sessionValue">(none)</code></div>
    <div id="debug">Debug: <code id="debugValue">(none)</code></div>

    <script>
        const button = document.getElementById("send");
        const input = document.getElementById("input");
        const status = document.getElementById("status");
        const conversation = document.getElementById("conversation");
        const sessionValueEl = document.getElementById("sessionValue");
        const debugValueEl = document.getElementById("debugValue");

        let inFlight = false;      // guard against overlapping requests
        let sessionState = "{}";   // null on first request, then echoed back from the server

        // Append a chat bubble and keep the newest message in view.
        function addMessage(role, text) {
            const msg = document.createElement("div");
            msg.className = "msg " + role;   // role is "user" or "assistant"
            msg.textContent = text;
            conversation.appendChild(msg);
            conversation.scrollTop = conversation.scrollHeight;
        }

        async function send() {
            if (inFlight) return;
            const userPrompt = input.value.trim();
            if (userPrompt === "") return;

            inFlight = true;
            button.disabled = true;
            button.textContent = "Sending…";
            status.textContent = "";

            // Show the user's message immediately and clear the input.
            addMessage("user", userPrompt);
            input.value = "";

            try {
                const response = await fetch("/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userPrompt, sessionState })
                });
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                const data = await response.json();   // { length, content, sessionState, debug }
                addMessage("assistant", data.chatResponse);
                sessionState = data.sessionState;     // echo this back on the next request
                sessionValueEl.textContent = sessionState ?? "(none)";
                // debug is an arbitrary diagnostic string and may be null/absent.
                debugValueEl.textContent = data.rawPrompt ?? "(none)";
            } catch (err) {
                status.textContent = "Error: " + err;
            } finally {
                inFlight = false;
                button.disabled = false;
                button.textContent = "Send";
                input.focus();
            }
        }

        button.addEventListener("click", send);

        // Enter sends; Shift+Enter inserts a newline.
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });
    </script>
</body>
</html>
