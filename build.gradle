plugins {
    id 'java'
}

// Single source of truth for the app version. Emitted via `printVersion` for tooling (Terraform/CI).
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    tools {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    toolsImplementation.extendsFrom implementation
    toolsRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation platform('software.amazon.awssdk:bom:2.33.13')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:s3vectors'
    implementation('software.amazon.awssdk:ssm') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'
    implementation 'dev.langchain4j:langchain4j:1.17.2'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.17.2'
    implementation 'dev.langchain4j:langchain4j-embeddings-bge-small-en-v15-q:1.17.2-beta27'
//    implementation 'com.openai:openai-java:4.43.0'

    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Local ONNX embeddings (the BGE model jar + onnxruntime + DJL tokenizers, ~135MB
// of native binaries) stay on the normal classpath so the offline Bootstrapper and
// local runs keep working — but they're excluded from the Lambda zip, which would
// otherwise blow past Lambda's size limits. The deployed function is expected to
// use OpenAI embeddings; if a manifest ever drives it down the local-embedding
// path, it fails fast with NoClassDefFoundError.
def lambdaExcludedLibs = [
    'onnxruntime-',
    'tokenizers-',
    'langchain4j-embeddings-bge-small-en-v15-q-',
]

// Lambda deployment package: compiled classes at the root, dependencies under lib/
tasks.register('buildZip', Zip) {
    archiveFileName = "rag-server-lambda-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from compileJava
    from processResources
    exclude 'previous-compilation-data.bin'
    into('lib') {
        from configurations.runtimeClasspath.filter { f ->
            !lambdaExcludedLibs.any { f.name.startsWith(it) }
        }
    }
}

build.dependsOn buildZip

// Emit just the version so tooling (Terraform/CI) can read it without parsing this file.
// Usage: ./gradlew -q printVersion
tasks.register('printVersion') {
    doLast {
        println project.version
    }
}
